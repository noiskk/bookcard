spring:
  profiles:
    active: prod

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  # Spring AI - OpenAI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
          max-tokens: 1000

server:
  port: 8080

# Image Storage
app:
  image:
    storage-path: uploads/images
    base-url: /images

# Naver API Configuration
naver:
  client:
    id: ${NAVER_CLIENT_ID:}
    secret: ${NAVER_CLIENT_SECRET:}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:bookcard-secret-key-must-be-at-least-32-characters-long}
  expiration-ms: 86400000  # 24시간

gemini:
  api:
    key: ${GEMINI_API_KEY:}
  image:
    model: gemini-2.5-flash-image

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:bookcard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://localhost:3306/bookcard
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
